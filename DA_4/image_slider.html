<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Slider Carousel</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: black;
    }

    .page {
      width: 90%;
      max-width: 900px;
      margin: 20px auto;
      border: 1px solid gray;
      padding: 12px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .slider {
      position: relative;
      width: 100%;
      height: 420px;
      border: 1px solid gray;
      overflow: hidden;
      background-color: black;
    }

    .slide {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      margin-top: 12px;
    }

    .btn {
      padding: 8px 14px;
      margin: 0 6px;
      border: 1px solid black;
      background-color: lightgray;
      color: black;
      cursor: pointer;
    }

    .dots {
      margin-top: 12px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid black;
      background-color: white;
      display: inline-block;
      margin: 0 4px;
      cursor: pointer;
    }

    .dot.active {
      background-color: black;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Homepage Image Slider</h1>

    <div class="slider" id="slider">
      <div class="slide">
        <img src="../DA_2/caesar_salad.png" alt="caesar_salad" />
      </div>
      <div class="slide">
        <img src="../DA_2/chicken.png" alt="chicken" />
      </div>
      <div class="slide">
        <img src="../DA_2/chocolate_brownie.png" alt="brownie" />
      </div>
      <div class="slide">
        <img src="../DA_2/vegetable_curry.png" alt="curry" />
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn">Previous</button>
      <button class="btn" id="nextBtn">Next</button>
    </div>

    <div class="dots" id="dots"></div>
  </div>

  <script>
    $(document).ready(function () {
      const slides = $(".slide");
      const dotsContainer = $("#dots");
      let currentIndex = 0;
      let sliderTimer;
      const delay = 3000;

      slides.each(function (index) {
        dotsContainer.append('<span class="dot" data-index="' + index + '"></span>');
      });

      const dots = $(".dot");

      function showSlide(index) {
        if (index >= slides.length) {
          index = 0;
        }
        if (index < 0) {
          index = slides.length - 1;
        }

        slides.stop(true, true).fadeOut(500);
        slides.eq(index).stop(true, true).fadeIn(500);

        dots.removeClass("active");
        dots.eq(index).addClass("active");

        currentIndex = index;
      }

      function nextSlide() {
        showSlide(currentIndex + 1);
      }

      function prevSlide() {
        showSlide(currentIndex - 1);
      }

      function startAutoSlide() {
        clearInterval(sliderTimer);
        sliderTimer = setInterval(function () {
          nextSlide();
        }, delay);
      }

      function restartAutoSlide() {
        startAutoSlide();
      }

      $("#nextBtn").on("click", function () {
        nextSlide();
        restartAutoSlide();
      });

      $("#prevBtn").on("click", function () {
        prevSlide();
        restartAutoSlide();
      });

      dots.on("click", function () {
        const index = Number($(this).attr("data-index"));
        showSlide(index);
        restartAutoSlide();
      });

      showSlide(0);
      startAutoSlide();
    });
  </script>
</body>
</html>
